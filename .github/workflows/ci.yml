name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  compose:
    name: Validate compose stacks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: docker compose config
        run: |
          set -euo pipefail
          for f in $(find stacks -name compose.yaml | sort); do
            d="$(dirname "$f")"
            echo "::group::$d"
            docker compose -f "$f" --env-file "$d/.env.example" config --quiet
            echo "OK"
            echo "::endgroup::"
          done

  lint:
    name: Lint YAML + shell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: yamllint
        run: pipx run yamllint --strict .
      - name: shellcheck
        run: shellcheck scripts/*.sh

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # Run the gitleaks CLI directly over the full history. More robust than the
      # gitleaks-action, whose commit-range logic breaks on force-pushes.
      - name: gitleaks (full history)
        run: |
          docker run --rm -v "$PWD:/repo" \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0='*' \
            ghcr.io/gitleaks/gitleaks:v8.24.3 \
            git /repo --redact --verbose --exit-code 1
