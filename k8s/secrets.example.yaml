# Template for the Secrets the manifests reference. Real values are never committed.
#
# Create them directly instead of editing this file:
#   sudo k3s kubectl create secret generic pihole-secrets  --from-literal=web-password='...'
#   homarr-secrets: same pattern, one literal named "encryption-key" holding
#                   64 hex characters (generate them with: openssl rand -hex 32)
#   sudo k3s kubectl create namespace nextcloud --dry-run=client -o yaml | sudo k3s kubectl apply -f -
#   sudo k3s kubectl -n nextcloud create secret generic nextcloud-db \
#     --from-literal=POSTGRES_USER='...' --from-literal=POSTGRES_PASSWORD='...' --from-literal=POSTGRES_DB=nextcloud
#   sudo k3s kubectl -n nextcloud create secret generic nextcloud-admin \
#     --from-literal=NEXTCLOUD_ADMIN_USER='...' --from-literal=NEXTCLOUD_ADMIN_PASSWORD='...'
#
# Note: Homarr's encryption key must stay the same once set, or Homarr can no longer
# decrypt the integration credentials it has stored.
apiVersion: v1
kind: Secret
metadata:
  name: pihole-secrets
  namespace: default
type: Opaque
stringData:
  web-password: CHANGE_ME
---
apiVersion: v1
kind: Secret
metadata:
  name: homarr-secrets
  namespace: default
type: Opaque
stringData:
  encryption-key: CHANGE_ME_64_HEX_CHARS
---
apiVersion: v1
kind: Secret
metadata:
  name: nextcloud-db
  namespace: nextcloud
type: Opaque
stringData:
  POSTGRES_USER: CHANGE_ME
  POSTGRES_PASSWORD: CHANGE_ME
  POSTGRES_DB: nextcloud
---
apiVersion: v1
kind: Secret
metadata:
  name: nextcloud-admin
  namespace: nextcloud
type: Opaque
stringData:
  NEXTCLOUD_ADMIN_USER: CHANGE_ME
  NEXTCLOUD_ADMIN_PASSWORD: CHANGE_ME
