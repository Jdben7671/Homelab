# Nextcloud 35 + PostgreSQL 14 + Redis 6.2
#
# Host:     raspi1 (192.168.1.57), deployed through CasaOS (BigBearCasaOS app store)
# Web UI:   http://192.168.1.57:7580
# Storage:  the Nextcloud *data* directory is NOT on the Pi. It is an NFS share from
#           TrueNAS mounted at /mnt/nextcloud-data (see docs/storage.md). The share
#           must be mounted before these containers start, otherwise the container
#           bind-mounts the empty local directory instead (see incidents/).
# Secrets:  copy .env.example to .env and fill it in. .env is git-ignored.
name: nextcloud

x-common: &common
  restart: unless-stopped
  networks: [nextcloud]
  cpu_shares: 90

services:
  nextcloud:
    <<: *common
    image: bigbeartechworld/big-bear-nextcloud-with-smbclient:35.0.1@sha256:ddaca2031622188e1cf789ea785a5f9ee7caedb9cdc01518d554089a498d2a12
    container_name: nextcloud
    hostname: nextcloud
    depends_on:
      db-nextcloud:
        condition: service_healthy
      redis-nextcloud:
        condition: service_healthy
    environment:
      NEXTCLOUD_ADMIN_USER: ${NEXTCLOUD_ADMIN_USER:?set in .env}
      NEXTCLOUD_ADMIN_PASSWORD: ${NEXTCLOUD_ADMIN_PASSWORD:?set in .env}
      POSTGRES_HOST: db-nextcloud
      POSTGRES_DB: ${POSTGRES_DB:-nextcloud}
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      REDIS_HOST: redis-nextcloud
      PHP_MEMORY_LIMIT: 1024M
      PHP_UPLOAD_LIMIT: 1024M
      OVERWRITEPROTOCOL: http
      TRUSTED_PROXIES: ""
    ports:
      - "7580:80"
    volumes:
      - ${APPDATA_DIR:-/DATA/AppData}/big-bear-nextcloud/html:/var/www/html
      # NFS mount from TrueNAS: 192.168.1.226:/mnt/Nextcloud/Nextcloud -> /mnt/nextcloud-data
      - ${NEXTCLOUD_DATA_DIR:-/mnt/nextcloud-data}:/var/www/html/data

  cron:
    <<: *common
    image: bigbeartechworld/big-bear-nextcloud-with-smbclient:35.0.1@sha256:ddaca2031622188e1cf789ea785a5f9ee7caedb9cdc01518d554089a498d2a12
    entrypoint: /cron.sh
    depends_on:
      db-nextcloud:
        condition: service_healthy
      redis-nextcloud:
        condition: service_healthy
    volumes:
      - ${APPDATA_DIR:-/DATA/AppData}/big-bear-nextcloud/html:/var/www/html

  db-nextcloud:
    <<: *common
    image: postgres:14.2@sha256:2c954f8c5d03da58f8b82645b783b56c1135df17e650b186b296fa1bb71f9cfd
    container_name: db-nextcloud
    hostname: db-nextcloud
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nextcloud}
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - ${APPDATA_DIR:-/DATA/AppData}/big-bear-nextcloud/pgdata:/var/lib/postgresql/data

  redis-nextcloud:
    <<: *common
    image: redis:6.2.20@sha256:d06ff6ec778c7f2a5c0dfaf58141d598efaa50a89d0e966faedfdf122cef451b
    container_name: redis-nextcloud
    hostname: redis-nextcloud
    user: "1000:1000"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - ${APPDATA_DIR:-/DATA/AppData}/big-bear-nextcloud/redis:/data

networks:
  nextcloud:
    name: big-bear-nextcloud_nextcloud_network
    driver: bridge
